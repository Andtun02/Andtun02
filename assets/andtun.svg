<svg xmlns="http://www.w3.org/2000/svg" width="280" height="84" viewBox="0 0 280 84" role="img" aria-label="andtun">
  <defs>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBC4B8" />
      <stop offset="50%" stop-color="#F39985" />
      <stop offset="100%" stop-color="#E2725B" />
    </linearGradient>
    <filter id="nameGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <text x="140" y="56" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="52" font-weight="700" letter-spacing="3"
        fill="url(#nameGradient)" filter="url(#nameGlow)">andtun</text>
</svg>
